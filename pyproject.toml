[project]
name = "clync"
version = "0.2.0"
description = "Headless sync of claude.ai chats + local Claude Code sessions into a contained Postgres/pgvector store, hybrid-searchable over MCP."
requires-python = ">=3.11"
# Search is core (ADR 0003): the BGE-M3 embedder + Postgres client ship with the
# base install — the contained PG17+pgvector cluster is clync's single source of
# truth AND search index, so there is no lighter search-free mode to preserve.
dependencies = [
    "cryptography>=42",
    "curl_cffi>=0.7",
    "mcp>=1.2",
    "FlagEmbedding>=1.3",
    "psycopg[binary]>=3.1",
    # transformers 5.x dropped the slow-tokenizer `prepare_for_model` that
    # FlagEmbedding 1.x calls (observed crashing during the reranker ablation);
    # pin to 4.x, which also carries the BGE-M3 embedder used here.
    "transformers>=4.51,<5",
]

[project.optional-dependencies]
# Test suite. The integration + real-model tests need the contained cluster too.
dev = ["pytest>=8"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: real-model / heavy integration — run with `pytest --run-slow`"]
